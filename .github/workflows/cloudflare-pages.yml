name: Deploy Docs to Cloudflare Pages

# Branch-based deploys:
#   - Pushing the PRODUCTION branch (set in Cloudflare Pages → Settings → Builds & deployments,
#     default "main") publishes to the production custom domain (e.g. docs.revosurge.com).
#   - Pushing ANY other branch publishes a Preview deployment at
#     https://<branch>.<project>.pages.dev  (unique URL per branch).
# Cloudflare decides production vs preview by comparing the --branch value below to the
# project's configured Production branch — so one workflow covers every branch.

on:
  push:
    branches: ['**']
  workflow_dispatch:

# One in-flight deploy per branch; newer pushes cancel older ones.
concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct Upload of the built site. --branch drives production vs preview.
          command: >-
            pages deploy .vitepress/dist
            --project-name=revo-docs
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      - name: Publish deployment URL
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
